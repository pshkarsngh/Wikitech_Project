# Reverse-proxy settings for every /api route, factored out because four locations
# need them identically and a copy-paste drift between them would be invisible.
#
# `proxy_pass` has NO trailing path. That is load-bearing: a trailing slash strips the
# `/api` prefix and every route 404s. See AGENTS.md section 5.

proxy_http_version 1.1;
proxy_pass http://fastapi;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# Do not leak the backend's implementation to the browser. `Server` is handled globally
# with server_tokens off; these two come from uvicorn and would otherwise name it.
proxy_hide_header X-Powered-By;
proxy_hide_header X-Process-Time;

# One analysis fans out to the MediaWiki API in batches, so the first byte can take far
# longer than the 60s default. The backend aborts its own upstream work on WikipediaError;
# this only covers slow success.
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
