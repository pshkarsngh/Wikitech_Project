# Security response headers, shared by every location that sends one.
#
# This file exists as an `include` rather than a block in `server` because of how nginx
# inherits `add_header`:
#
#   "These directives are inherited from the previous configuration level if and only if
#    there are no add_header directives defined on the current level."
#   -- https://nginx.org/en/docs/http/ngx_http_headers_module.html
#
# So the obvious fix - put the headers in `server` - silently drops every one of them from
# any location that sets a header of its own. This config sets `Cache-Control` in
# `location /assets/` and `location = /index.html`, which means the headers would vanish
# from the two responses that matter most: the hashed bundles and the HTML document that
# loads them. Nothing errors. The site just quietly stops being protected.
#
# `add_header_inherit merge` would express this properly, but it needs nginx 1.29.3 and the
# image is 1.27, so `include` is the portable answer. Every location that adds a header of
# its own must include this file; `tests/test_deployment_contract.py` enforces that.
#
# `always` is required on all of them. Without it nginx omits the header on error
# responses, which is exactly when an analysis times out and a 502 goes out.

# No third-party origins are needed: the SPA is served same-origin and the client calls a
# relative /api, so `connect-src 'self'` is complete rather than merely restrictive.
# `frame-ancestors 'none'` and `object-src 'none'` are the two that stop whole classes.
# `style-src` needs 'unsafe-inline' because React sets style attributes on legend swatches
# (frontend/src/components/ui.jsx).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Stops a browser guessing that a text/plain response is executable.
add_header X-Content-Type-Options "nosniff" always;

# Redundant with frame-ancestors above, kept for very old browsers.
add_header X-Frame-Options "DENY" always;

# Article titles are sent to en.wikipedia.org from links on this page. The default already
# sends only the origin, which is what is wanted, so this states it rather than relying on
# a browser default that has changed before.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here uses a browser sensor or a payment API.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Cross-origin isolation. Not required by anything here today; cheap, and it forecloses
# Spectre-class cross-origin reads if a future dependency ever needs SharedArrayBuffer.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Strict-Transport-Security is deliberately NOT set. It is only honoured over HTTPS and is
# ignored over plain HTTP, so sending it now would be a no-op that looks like a control.
# It belongs with TLS termination, in the same commit as the certificate.
