# Production deployment.
#
#   cp .env.production.example .env      # then edit every credential
#   docker compose -f docker-compose.production.yml --env-file .env up -d
#
# The `build:` blocks are a first-deploy convenience, not the normal path: compose
# builds a service only when its tagged image is absent locally, so once a release tag
# exists on the host this file pulls nothing and rebuilds nothing. There is no registry
# yet (see ROLLBACK.md §6), so the images live on the host and the tag is the only lever.
# A rollback is therefore a *named* tag, never `latest` - with `latest` there is nothing
# to go back to.

name: find-missing

services:
  db:
    image: postgres:16-alpine
    container_name: find-missing-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      # No default. A production password that falls back to a known string is
      # worse than a failed deploy, so compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only runs when the volume is first created. Apply by hand on every
      # later schema change; see deploy/README.md.
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    expose:
      - "5432"
    # Docker's default json-file driver does not rotate, and `db.ping()` logs a full
    # traceback on every failure, so an outage writes one to an unbounded file every 30
    # seconds from the healthcheck alone. Docker's docs say to use `local` to prevent disk
    # exhaustion; dual logging keeps `docker logs` working against a rotating cache, which
    # deploy/ROLLBACK.md section 4 relies on.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  api:
    image: ${API_IMAGE:-find-missing-api}:${RELEASE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: find-missing-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `connect_timeout` is load-bearing, not decoration. `create_all()` runs on the
      # app's lifespan *before* uvicorn accepts connections, and a host that blackholes
      # rather than refuses packets blocks on TCP SYN retries for about two minutes.
      # The image healthcheck gives up at ~110s and `web` waits on it, so the whole
      # deployment would come up broken with no log line explaining why. Five seconds
      # turns an unbounded hang into a logged failure that the app then survives, which
      # is the documented contract: a database problem must never fail a request.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connect_timeout=5
      # Wikimedia asks every client to identify itself, and a deployment should
      # carry its own contact address rather than the repository URL.
      USER_AGENT: ${USER_AGENT:?set USER_AGENT in .env}
      # The SPA is served same-origin through nginx, so nothing cross-origin is
      # expected. Set this only if something else calls the API directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      # The shared key for the crawl routes. Defaulted to empty rather than required,
      # because empty is a legitimate "this deployment is open" decision and the app
      # treats it as one. Set it in .env and the crawl routes start refusing anonymous
      # traffic; leave it and the deployment behaves exactly as it did before.
      # `GET /api/health` reports the result as `auth_required`, so an operator can
      # confirm which mode a running deployment is actually in.
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      # Exposed here rather than left at the image default because it is coupled to
      # something the operator can also change: `proxy_read_timeout` in
      # frontend/nginx-proxy-api.conf. If this reaches it, nginx closes the connection
      # at the moment the backend is about to write a body, and a partial analysis
      # arrives as a bare 502 with no body and no `aborted` marker. Keep this
      # comfortably below it; the backend must finish and answer first.
      ANALYSIS_DEADLINE_SECONDS: ${ANALYSIS_DEADLINE_SECONDS:-100}
    expose:
      - "8000"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  web:
    image: ${WEB_IMAGE:-find-missing-web}:${RELEASE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: find-missing-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Expanded into /etc/nginx/templates/default.conf.template at start-up.
      API_UPSTREAM: api:8000
    ports:
      - "${WEB_PORT:-80}:80"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

volumes:
  pgdata:
