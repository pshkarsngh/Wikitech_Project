# Staging deployment. Same images as production, different host, different
# database volume. Bring it up with:
#
#   cd deploy
#   docker compose -f docker-compose.staging.yml up -d --build
#
# Staging is where Phase 6 UAT is executed, so it must be deployment-like:
# built images, real nginx, real PostgreSQL, real network path to MediaWiki.
# Nothing here is stubbed or mocked.

name: find-missing-staging

services:
  db:
    image: postgres:16-alpine
    container_name: find-missing-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: find_missing
      POSTGRES_USER: postgres
      # Staging-only credential. Production supplies its own through the shell
      # environment; see deploy/README.md.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging-only-change-me}
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
      # Runs on first volume creation only, exactly as in database/docker-compose.yml.
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d find_missing"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Not published. Only the api container needs to reach the database, and
    # exposing it would put an unauthenticated port on the host for no reason.
    expose:
      - "5432"
    # Docker's default json-file driver does not rotate, and `db.ping()` logs a full
    # traceback on every failure, so an outage writes one to an unbounded file every 30
    # seconds from the healthcheck alone. Docker's docs say to use `local` to prevent disk
    # exhaustion; dual logging keeps `docker logs` working against a rotating cache.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: find-missing-staging-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `connect_timeout` is load-bearing, and for the same reason production sets it at
      # docker-compose.production.yml: `create_all()` runs on the app's lifespan *before*
      # uvicorn accepts connections, so a host that blackholes rather than refuses packets
      # blocks on TCP SYN retries for about two minutes - past the image healthcheck's
      # budget, so `web` never starts and no log line explains why. Five seconds turns an
      # unbounded hang into a logged failure the app then survives, which is the
      # documented contract: a database problem must never fail a request.
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-staging-only-change-me}@db:5432/find_missing?connect_timeout=5
      # The SPA is served same-origin through nginx, so nothing cross-origin is
      # expected. This is here for direct port access while debugging UAT.
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      USER_AGENT: ${USER_AGENT:-FindTheMissingConnections/0.1 (https://github.com/pshkarsngh/Wikitech_Project)}
      # Set this to exercise the invite-only path in the stack UAT runs against:
      # ANALYSIS_API_KEY=some-ascii-string. Empty keeps staging open, which is the
      # default. `GET /api/health` reports the mode as `auth_required`.
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
      # Lower than production on purpose. This is where the deadline is worth
      # exercising: set it low enough to hit on a real article and the stack should
      # answer 200 with `summary.aborted` on /api/analyze and 504 on the list routes,
      # rather than running until nginx gives up. Keep it under
      # `proxy_read_timeout` in frontend/nginx-proxy-api.conf.
      ANALYSIS_DEADLINE_SECONDS: ${ANALYSIS_DEADLINE_SECONDS:-100}
    expose:
      - "8000"
    # Published on loopback only, so a UAT run can hit the API without going
    # through nginx. This is how smoke_test.py is pointed at the backend alone.
    ports:
      - "127.0.0.1:8081:8000"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: find-missing-staging-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Consumed by /etc/nginx/templates/default.conf.template at start-up.
      API_UPSTREAM: api:8000
    ports:
      - "8080:80"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

volumes:
  staging-pgdata:
