name: CI

# The release gate. Every job here is something that used to be a manual,
# unverifiable claim: the test suite could not be run, lint was local-only, and
# nothing proved the images built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Trust, because the service is only reachable from this runner and the tests
          # need no credential. A real deployment sets POSTGRES_PASSWORD and the compose
          # file refuses to start without it.
          POSTGRES_HOST_AUTH_METHOD: trust
          # Without this the service creates only the default `postgres` database, and
          # TEST_DATABASE_URL below would name a database that does not exist.
          POSTGRES_DB: find_missing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Without this the whole persistence suite skips, and a skipped suite reads exactly
      # like a passing one. UAT-02 shipped because no test ever opened a connection.
      TEST_DATABASE_URL: >-
        postgresql+psycopg://postgres@127.0.0.1:5432/find_missing_test?connect_timeout=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install requirements
        # pytest-asyncio and httpx2 are not optional: without them the suite
        # does not merely fail, it aborts with an INTERNALERROR and runs zero
        # tests, which reads like a pass.
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

      - name: The database suite did not skip
        # A service that fails to come up turns the 13 persistence tests into 13 skips,
        # which is the exact failure mode this job now exists to prevent.
        run: |
          output=$(pytest -q -rs tests/test_persistence.py 2>&1)
          echo "$output"
          if echo "$output" | grep -qi skipped; then
            echo "::error::the persistence suite skipped - postgres is not reachable"
            exit 1
          fi

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # The frontend suite was missing here, which is how DEF-003 shipped: the API
        # client dropped `method` and `body`, so the browser sent GET /api/analyze and
        # got a 405, and nothing in CI ever noticed because no test made a request.
        # `backend/tests/test_deployment_contract.py` also reads vite.config.js, so
        # `npm ci` has to run before pytest does - it already does.
        run: npm run test

      - name: Build
        run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: find-missing-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: find-missing-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Images start and the stack serves end to end
        # Proves the images are runnable, not merely buildable. Nothing here
        # reaches the network: the health endpoint and the SPA are both local.
        run: |
          docker network create ci-net

          docker run -d --name ci-api --network ci-net find-missing-api:ci

          for i in $(seq 1 30); do
            if docker exec ci-api python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker exec ci-api python -c \
            "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/api/health').read().decode())"

          docker run -d --name ci-web --network ci-net -p 8080:80 \
            -e API_UPSTREAM=ci-api:8000 find-missing-web:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          echo "index.html served"

          # A deep link must return the SPA, not a 404: react-router owns the URL.
          curl -fsS http://127.0.0.1:8080/connection-map | grep -q '<div id="root">'
          echo "SPA history fallback works"

          # The nginx template must have expanded API_UPSTREAM, or /api 502s.
          curl -fsS http://127.0.0.1:8080/api/health
          echo
          echo "API proxy works"

          docker rm -f ci-web ci-api
          docker network rm ci-net

  schema:
    name: Models match init.sql, and the tree is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned requirements exactly
        # pip-audit, not a reinstall: the pins in requirements.txt are the supply-chain
        # control, and a range would let this job verify code nobody has tested.
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          # Production dependencies only. The one outstanding advisory is in vitest's
          # @vitest/mocker and needs a breaking major bump; see docs/HARDENING.md.
          npm audit --omit=dev --audit-level=moderate

      - name: No secret is staged, tracked or baked into an image
        run: |
          # A cheap, high-value gate. Nothing here proves the absence of a leak; it
          # proves the common mistake is absent.
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::a .env file is tracked in git"
            exit 1
          fi
          if git log --all --diff-filter=A --name-only --format= \
             | grep -E '(^|/)\.env$' | sort -u | grep .; then
            echo "::error::a .env file was committed at some point in history"
            exit 1
          fi
          if grep -rn --include=Dockerfile -E '^\s*(COPY|ADD)\s+\.env' . ; then
            echo "::error::a Dockerfile copies .env into an image"
            exit 1
          fi
          echo "no .env tracked, committed or copied into an image"

      - name: Table names agree across the two-file invariant
        # models.py and database/init.sql describe one schema and are only
        # ever updated together. This is the cheapest way to notice when they
        # drift, which create_all() would otherwise hide in production.
        run: |
          python - <<'PY'
          import re, pathlib, sys

          models = pathlib.Path('backend/app/models.py').read_text(encoding='utf-8')
          sql = pathlib.Path('database/init.sql').read_text(encoding='utf-8')

          in_models = set(re.findall(r'__tablename__\s*=\s*"(\w+)"', models))
          in_sql = set(re.findall(r'CREATE TABLE IF NOT EXISTS\s+(\w+)', sql, re.I))

          missing_sql = in_models - in_sql
          missing_models = in_sql - in_models
          if missing_sql or missing_models:
              print('models.py tables:', sorted(in_models))
              print('init.sql tables: ', sorted(in_sql))
              if missing_sql:
                  print('in models.py but not init.sql:', sorted(missing_sql))
              if missing_models:
                  print('in init.sql but not models.py:', sorted(missing_models))
              sys.exit(1)
          print('tables agree:', ', '.join(sorted(in_models)))
          PY
