services:
  db:
    image: postgres:16-alpine
    container_name: find-missing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: find_missing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d find_missing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
